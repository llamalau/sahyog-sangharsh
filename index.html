  .pill-yellow { background: #FEF3C7; color: #D97706; }

  .pill-blue { background: #DBEAFE; color: #2563EB; }

  .dot-yellow { background: #F59E0B; }
  .dot-red { background: #EF4444; }

  .clickable:active { transform: translateY(0); }

  #app { transition: opacity 0.15s ease; }
  .tab-active { background: white; border-color: #e5e7eb; border-bottom-color: white; font-weight: 600; color: #32373c; }
  .tab-inactive { color: #6b7280; }
  .tab-inactive:hover { color: #32373c; }
  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 100; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.15s; }
  .sidebar-link:hover { background: rgba(255,255,255,0.08); }
  .sidebar-link.active { background: rgba(212,168,67,0.15); color: #D4A843; }
  .wa-check { color: #8a9a8a; font-size: 12px; }
  .wa-check.read { color: #53BDEB; }
  @media (max-width: 768px) {
    .sidebar-desktop { display: none; }

// ========== HELPER FUNCTIONS ==========
function getDomain(name) {
  return APP_DATA.domains.find(d => d.name === name) || APP_DATA.domains[0];
}

function getStudent(id) {
  return APP_DATA.students.find(s => s.id === parseInt(id));
}

function statusLabel(status) {
  if (status === 'green') return 'Active';
  if (status === 'yellow') return 'Needs Attention';
  return 'Inactive';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function openModal(studentId) {
  const s = getStudent(studentId);
  const modal = document.getElementById('wa-modal');
  document.getElementById('wa-modal-body').innerHTML = `
    <div class="bg-wa-bg rounded-xl p-4 space-y-3">
      <div class="text-center"><span class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full">Today</span></div>
      <div class="bg-wa-outgoing rounded-lg p-3 ml-8 relative text-sm" style="border-top-right-radius:0;">

        <p class="mb-2">Aaj ka activity ${s.name.split(' ')[0]} ke liye:</p>
        ${APP_DATA.weeklyPlan.days[0].activities.map(a => `
          <p class="font-medium">${a.domain}: ${a.title}</p>
          <p class="text-gray-600 text-xs">Samay: ${a.duration}</p>
        `).join('<hr class="my-1.5 border-gray-200">')}
        <hr class="my-2 border-gray-200">
        <p class="text-xs text-gray-500 italic">Tasks for Monday - ${APP_DATA.weeklyPlan.week}</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-3 text-center">This message will be sent to <strong>${s.phone}</strong></p>
  `;
  modal.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('wa-modal').classList.add('hidden');
}

function confirmSend() {
  closeModal();
  showToast('Tasks sent via WhatsApp!');
}

function toggleMobileSidebar() {
  const overlay = document.getElementById('mobile-overlay');
  overlay.classList.toggle('hidden');
}

// ========== ROUTER ==========
function navigate(hash) {
  window.location.hash = hash;
}

function updateSidebarActive(section) {
  document.querySelectorAll('.sidebar-link').forEach(link => {
    link.classList.toggle('active', link.dataset.nav === section);
  });
}

function router() {
  const hash = window.location.hash || '#/roster';
  const app = document.getElementById('app');

  if (hash === '#/roster' || hash === '#/' || hash === '') {
    updateSidebarActive('roster');
    renderRoster();
  } else if (hash.startsWith('#/student/')) {
    updateSidebarActive('roster');
    const id = hash.split('/')[2];
    renderStudentProfile(id);
  } else if (hash.startsWith('#/planning/')) {
    updateSidebarActive('planning');
    const id = hash.split('/')[2];
    renderPlanning(id);
  } else if (hash.startsWith('#/reports/')) {
    updateSidebarActive('reports');
    const id = hash.split('/')[2];
    renderReports(id);
  } else {
    updateSidebarActive('roster');
    renderRoster();
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', router);
window.addEventListener('load', router);

function filterRoster() {
  const search = document.getElementById('roster-search').value.toLowerCase();
  const filter = document.getElementById('roster-filter').value;
  const grid = document.getElementById('roster-grid');

  const filtered = APP_DATA.students.filter(s => {
    const matchSearch = s.name.toLowerCase().includes(search) || s.diagnosis.toLowerCase().includes(search) || s.caregiver.toLowerCase().includes(search);
    const matchFilter = filter === 'all' || s.status === filter;
    return matchSearch && matchFilter;
  });

  grid.innerHTML = filtered.length > 0
    ? filtered.map(s => studentCard(s)).join('')
    : '<div class="col-span-full text-center py-12 text-gray-400">No students match your search.</div>';
}

function renderWATab() {
  const messages = APP_DATA.waHistory;
  let currentDate = '';
  let html = '<div class="bg-wa-bg rounded-xl p-4 space-y-2" style="min-height:400px;">';

  messages.forEach(m => {
    if (m.date !== currentDate) {
      currentDate = m.date;
      html += `<div class="text-center my-2"><span class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full">${m.date}</span></div>`;
    }
    if (m.type === 'sent') {
      const checkIcon = m.check === 'read'
        ? '<span class="wa-check read">&#10003;&#10003;</span>'
        : m.check === 'delivered'
        ? '<span class="wa-check">&#10003;&#10003;</span>'
        : '<span class="wa-check">&#10003;</span>';
      html += `
        <div class="bg-wa-outgoing rounded-lg p-3 ml-12 relative text-sm" style="border-top-right-radius:0;">
          <p class="whitespace-pre-line">${m.text}</p>
          <div class="flex items-center justify-end gap-1 mt-1 text-xs text-gray-500">${m.time} ${checkIcon}</div>
        </div>`;
    } else {
      html += `
        <div class="bg-white rounded-lg p-3 mr-12 relative text-sm" style="border-top-left-radius:0;">
          <p class="whitespace-pre-line">${m.text}</p>
          <div class="text-xs text-gray-400 mt-1 text-right">${m.time}</div>
        </div>`;
    }
  });

  html += '</div>';
  html += `
    <div class="mt-4 bg-white rounded-xl border border-gray-200 p-4">
      <h4 class="font-semibold text-sm mb-2">Send Message</h4>
      <div class="flex gap-2">
        <input type="text" placeholder="Type a message to caregiver..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wa-teal/30">
        <button class="bg-wa-teal text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 hover:bg-wa-green" onclick="showToast('Message sent!')">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          Send
        </button>
      </div>
    </div>
  `;
  return html;
}
