<style>
  .pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
  .pill-red { background: #FEE2E2; color: #DC2626; }
  .pill-yellow { background: #FEF3C7; color: #D97706; }
  .pill-green { background: #D1FAE5; color: #059669; }
  .pill-blue { background: #DBEAFE; color: #2563EB; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-green { background: #22C55E; }
  .dot-yellow { background: #F59E0B; }
  .dot-red { background: #EF4444; }
  .chart-label { font-size: 10px; color: #888; text-align: center; margin-top: 4px; }
  .clickable { cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .clickable:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(212,168,67,0.25); }
  .clickable:active { transform: translateY(0); }
  html { scroll-behavior: smooth; }
  #app { transition: opacity 0.15s ease; }
  .tab-active { background: white; border-color: #e5e7eb; border-bottom-color: white; font-weight: 600; color: #32373c; }
  .tab-inactive { color: #6b7280; }
  .tab-inactive:hover { color: #32373c; }
  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 100; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.15s; }
  .sidebar-link:hover { background: rgba(255,255,255,0.08); }
  .sidebar-link.active { background: rgba(212,168,67,0.15); color: #D4A843; }
  .wa-check { color: #8a9a8a; font-size: 12px; }
  .wa-check.read { color: #53BDEB; }
  .loading { display: flex; align-items: center; justify-content: center; min-height: 200px; color: #999; }
  .loading::after { content: ''; width: 24px; height: 24px; border: 3px solid #e5e7eb; border-top-color: #D4A843; border-radius: 50%; animation: spin 0.6s linear infinite; margin-left: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 768px) {
    .sidebar-desktop { display: none; }
    .mobile-header { display: flex !important; }
    .main-content { margin-left: 0 !important; padding-top: 3.5rem !important; }
  }
  @media (min-width: 769px) {
    .mobile-header { display: none !important; }
    .sidebar-mobile-overlay { display: none !important; }
  }
  .search-wrap { position: relative; }
  .search-results { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); z-index: 30; max-height: 240px; overflow-y: auto; display: none; }
  .search-results.open { display: block; }
  .search-result { padding: 8px 12px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .search-result:hover, .search-result.active { background: #f8f5ef; }
  .domain-filter { cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.15s; border: 2px solid transparent; }
  .domain-filter:hover { opacity: 0.8; }
  .domain-filter.selected { border-color: currentColor; background: rgba(0,0,0,0.05); }
  .domain-filter.dimmed { opacity: 0.3; }
</style>

// Cache
let _studentsCache = null;
let _studentDetailCache = {};

// ========== STATIC API LAYER ==========
async function api(path, opts) {
  if (path === '/reports') {
    return APP_DATA.reports;
  }
  return {};
}

async function fetchStudents(force) {
  if (_studentsCache && !force) return _studentsCache;
  _studentsCache = APP_DATA.students.slice();
  return _studentsCache;
}

async function fetchStudentDetail(id, force) {
  id = Number(id);
  if (_studentDetailCache[id] && !force) return _studentDetailCache[id];

  const student = APP_DATA.students.find(s => s.id === id);
  if (!student) throw new Error('Student not found');

  const detail = APP_DATA.details[id] || { assessments: [], latestPlan: null, messages: [], progress: {}, waStats: {} };
  _studentDetailCache[id] = {
    ...student,
    assessments: detail.assessments || [],
    latestPlan: detail.latestPlan || null,
    messages: detail.messages || [],
    progress: detail.progress || {},
    waStats: detail.waStats || {}
  };
  return _studentDetailCache[id];
}

// ========== HELPERS ==========
function getDomain(name) {
  return DOMAINS.find(d => d.name === name) || DOMAINS[0];
}

const AVATAR_STYLES = [
  ['bg-pink-100', 'text-pink-600'], ['bg-purple-100', 'text-purple-600'],
  ['bg-blue-100', 'text-blue-600'], ['bg-green-100', 'text-green-600'],
  ['bg-orange-100', 'text-orange-600'], ['bg-teal-100', 'text-teal-600'],
  ['bg-indigo-100', 'text-indigo-600'], ['bg-rose-100', 'text-rose-600'],
];

function avatarFor(s, idx) {
  const style = AVATAR_STYLES[(idx || s.id - 1) % AVATAR_STYLES.length];
  return { bg: style[0], text: style[1], initial: (s.name || 'X')[0] };
}

function pillClass(level) {
  if (!level) return 'pill-red';
  if (level.includes('Often') || level === 'Independent') return 'pill-green';
  if (level.includes('Sometimes')) return 'pill-yellow';
  return 'pill-red';
}

function statusLabel(status) {
  if (status === 'green') return 'Active';
  if (status === 'yellow') return 'Needs Attention';
  return 'Inactive';
}

function formatDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + (dateStr.includes('T') ? '' : 'Z'));
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.className = 'toast ' + (isError ? 'bg-red-600' : 'bg-green-600') + ' text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm font-medium show';
  document.getElementById('toast-msg').textContent = msg;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function toggleMobileSidebar() {
  document.getElementById('mobile-overlay').classList.toggle('hidden');
}

function closeModal() {
  document.getElementById('wa-modal').classList.add('hidden');
}

// ========== ROUTER ==========
function navigate(hash) { window.location.hash = hash; }

async function navigateToFirstChild(section) {
  const students = await fetchStudents();
  if (students.length > 0) navigate('#/' + section + '/' + students[0].id);
  else navigate('#/roster');
}

function updateSidebarActive(section) {
  document.querySelectorAll('.sidebar-link').forEach(link => {
    link.classList.toggle('active', link.dataset.nav === section);
  });
}

async function router() {
  const hash = window.location.hash || '#/roster';
  const app = document.getElementById('app');

  if (hash === '#/roster' || hash === '#/' || hash === '') {
    updateSidebarActive('roster');
    await renderRoster();
  } else if (hash.startsWith('#/student/')) {
    updateSidebarActive('roster');
    await renderStudentProfile(hash.split('/')[2]);
  } else if (hash.startsWith('#/planning/')) {
    updateSidebarActive('planning');
    await renderPlanning(hash.split('/')[2]);
  } else if (hash.startsWith('#/reports/')) {
    updateSidebarActive('reports');
    await renderReports(hash.split('/')[2]);
  } else {
    updateSidebarActive('roster');
    await renderRoster();
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', router);
window.addEventListener('load', router);

  const waStatus = noResponse
    ? `<div class="flex items-center gap-1.5 text-xs text-red-400 mt-1">${waIcon} No response</div>`
    : lastMsgDate
    ? `<div class="flex items-center gap-1.5 text-xs text-gray-400 mt-1"><span class="text-wa-teal">${waIcon}</span> Last msg: ${lastMsgDate}</div>`

  const admissionLine = admissionDate

  return `<div class="bg-white rounded-xl border border-gray-200 p-4 clickable hover:border-sahyog-gold transition-colors" onclick="navigate('#/student/${s.id}')">

    ${waStatus}
  </div>`;
}

async function filterRoster() {
  const search = document.getElementById('roster-search').value.toLowerCase();
  const filter = document.getElementById('roster-filter').value;
  const grid = document.getElementById('roster-grid');
  const students = await fetchStudents();
  const filtered = students.filter(s => {
    const matchSearch = (s.name || '').toLowerCase().includes(search) || (s.diagnosis || '').toLowerCase().includes(search) || (s.caregiver_name || '').toLowerCase().includes(search);
    const matchFilter = filter === 'all' || s.status === filter;
    return matchSearch && matchFilter;
  });
  grid.innerHTML = filtered.length > 0
    ? filtered.map((s, i) => studentCard(s, i)).join('')
    : '<div class="col-span-full text-center py-12 text-gray-400">No students match your search.</div>';
}

async function switchProfileTab(tab, childId) {
  ['niepid','plans','wa'].forEach(t => {
    const btn = document.getElementById('profile-tab-' + t);
    if (btn) btn.className = t === tab
      ? 'px-4 py-2 text-sm border border-gray-200 border-b-white rounded-t-lg -mb-px tab-active'
      : 'px-4 py-2 text-sm rounded-t-lg -mb-px tab-inactive';
  });
  const content = document.getElementById('profile-tab-content');
  const s = await fetchStudentDetail(childId);
  if (tab === 'niepid') content.innerHTML = renderNIEPIDTab(s);
  else if (tab === 'plans') content.innerHTML = renderPlansTab(s);
  else content.innerHTML = renderWATab(s);
}

function renderNIEPIDTab(s) {
  const assessments = s.assessments || [];
  if (assessments.length === 0) return '<div class="text-center py-12 text-gray-400">No assessments recorded yet.</div>';

  const rows = assessments.map((a, i) => {
    const d = getDomain(a.domain);
    return `<tr class="${i % 2 === 0 ? '' : 'bg-gray-50/50'}">
      <td class="px-4 py-3 font-medium text-sm"><span class="inline-block w-2.5 h-2.5 rounded-full ${d.dotClass} mr-2"></span>${a.domain}</td>
      <td class="px-4 py-3 text-sm text-gray-500">${a.level || '-'}</td>
      <td class="px-4 py-3"><span class="pill ${pillClass(a.baseline)}" style="font-size:11px">${a.baseline || '-'}</span></td>
      <td class="px-4 py-3"><span class="pill ${pillClass(a.current_level)}" style="font-size:11px">${a.current_level || '-'}</span></td>
      <td class="px-4 py-3 text-green-600 font-semibold">&#9650;</td>

  return `<div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto"><table class="w-full">
      <thead class="bg-gray-50"><tr>
        <th class="text-left px-4 py-3 font-semibold text-sm text-gray-600">Domain</th>
        <th class="text-left px-4 py-3 font-semibold text-sm text-gray-600">Level</th>

function renderPlansTab(s) {
  const plan = s.latestPlan;
  if (!plan || !plan.tasks || plan.tasks.length === 0) return '<div class="text-center py-12 text-gray-400">No plans assigned yet.</div>';

  // Group tasks by day
  const byDay = {};
  const dayNames = ['','MON','TUE','WED','THU','FRI','SAT','SUN'];
  for (const t of plan.tasks) {
    const dn = t.day_number;
    if (!byDay[dn]) byDay[dn] = { day: dayNames[dn] || 'Day '+dn, activities: [] };
    byDay[dn].activities.push(t);
  }
  const days = Object.values(byDay);

  return `<div class="bg-white rounded-xl border border-gray-200 p-5">
    <div class="flex items-center justify-between mb-4">
      <div><h3 class="font-bold text-sm">${plan.title}</h3><p class="text-xs text-gray-500">Starts ${plan.start_date}</p></div>

    <div class="grid grid-cols-5 gap-3">
      ${days.map(day => `<div class="bg-gray-50 rounded-lg border border-gray-200 p-3">

        ${day.activities.map(a => {

function renderWATab(s) {
  const messages = (s.messages || []).slice().reverse();
  if (messages.length === 0) return `<div class="text-center py-12 text-gray-400">No WhatsApp messages yet.</div>
    <div class="mt-4 bg-white rounded-xl border border-gray-200 p-4">
      <h4 class="font-semibold text-sm mb-2">Send Message</h4>
      <div class="flex gap-2">
        <input id="wa-msg-input" type="text" placeholder="Type a message..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wa-teal/30">
        <button class="bg-wa-teal text-white px-4 py-2 rounded-lg text-sm font-medium" onclick="sendSingleMessage(${s.id})">Send</button>
      </div>
    </div>`;

  let html = '<div class="bg-wa-bg rounded-xl p-4 space-y-2" style="min-height:400px;">';
  let currentDate = '';
  for (const m of messages) {
    const date = (m.created_at || '').split(' ')[0] || 'Unknown';
    if (date !== currentDate) {
      currentDate = date;
      html += `<div class="text-center my-2"><span class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full">${date}</span></div>`;
    }
    if (m.direction === 'sent') {
      const check = m.status === 'read' ? '<span class="wa-check read">&#10003;&#10003;</span>' : m.status === 'delivered' ? '<span class="wa-check">&#10003;&#10003;</span>' : '<span class="wa-check">&#10003;</span>';
      html += `<div class="bg-wa-outgoing rounded-lg p-3 ml-12 relative text-sm" style="border-top-right-radius:0;"><p class="whitespace-pre-line">${m.body}</p><div class="flex items-center justify-end gap-1 mt-1 text-xs text-gray-500">${(m.created_at||'').split(' ')[1]||''} ${check}</div></div>`;
    } else {
      html += `<div class="bg-white rounded-lg p-3 mr-12 relative text-sm" style="border-top-left-radius:0;"><p class="whitespace-pre-line">${m.body}</p><div class="text-xs text-gray-400 mt-1 text-right">${(m.created_at||'').split(' ')[1]||''}</div></div>`;
    }
  }
  html += '</div>';
  html += `<div class="mt-4 bg-white rounded-xl border border-gray-200 p-4">
    <h4 class="font-semibold text-sm mb-2">Send Message</h4>
    <div class="flex gap-2">
      <input id="wa-msg-input" type="text" placeholder="Type a message to caregiver..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wa-teal/30">
      <button class="bg-wa-teal text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 hover:bg-wa-green" onclick="sendSingleMessage(${s.id})">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> Send
      </button>
    </div>
  </div>`;
  return html;
}

// ========== STUDENT SEARCH BAR ==========
async function openStudentSearch(input, section) {
  input.select();
  filterStudentSearch(input, section);
}

async function filterStudentSearch(input, section) {
  const query = input.value.toLowerCase();
  const students = await fetchStudents();
  const results = document.getElementById('search-results-' + section);
  const matches = students.filter(s => (s.name||'').toLowerCase().includes(query) || (s.diagnosis||'').toLowerCase().includes(query));
  if (matches.length === 0) {
    results.innerHTML = '<div class="search-result text-gray-400">No matches</div>';
  } else {
    results.innerHTML = matches.map(s => {
      const av = avatarFor(s);
      return `<div class="search-result" onmousedown="navigate('#/${section}/${s.id}')">
        <div class="w-6 h-6 rounded-full ${av.bg} flex items-center justify-center ${av.text} text-xs font-bold">${av.initial}</div>
        <div><div class="font-medium">${s.name}</div><div class="text-xs text-gray-400">${s.diagnosis||''}</div></div>
      </div>`;
    }).join('');
  }
  results.classList.add('open');
  input.addEventListener('blur', () => setTimeout(() => results.classList.remove('open'), 150), { once: true });
}

// ========== DOMAIN FILTER ==========
let _activeDomain = -1; // -1 = all
function toggleDomainFilter(idx, childId) {
  if (_activeDomain === idx) {
    _activeDomain = -1; // toggle off = show all
  } else {
    _activeDomain = idx;
  }
  updateChartVisibility();
  updateDomainFilterUI();
}

function updateDomainFilterUI() {
  document.querySelectorAll('.domain-filter').forEach(el => {
    const elIdx = parseInt(el.dataset.domainIdx);
    if (_activeDomain === -1) {
      el.classList.add('selected');
      el.classList.remove('dimmed');
    } else if (elIdx === _activeDomain) {
      el.classList.add('selected');
      el.classList.remove('dimmed');
    } else if (elIdx === -1) {
      el.classList.remove('selected');
      el.classList.add('dimmed');
    } else {
      el.classList.remove('selected');
      el.classList.add('dimmed');
    }
  });
}

function updateChartVisibility() {
  const chartEl = document.getElementById('chart-bars');
  if (!chartEl) return;
  // Each week group contains bar divs for each domain
  const weekGroups = chartEl.children;
  for (const weekGroup of weekGroups) {
    const barContainer = weekGroup.querySelector('div');
    if (!barContainer) continue;
    const bars = barContainer.children;
    for (let i = 0; i < bars.length; i++) {
      if (_activeDomain === -1) {
        bars[i].style.opacity = '1';
        bars[i].style.transition = 'opacity 0.2s';
      } else if (i === _activeDomain) {
        bars[i].style.opacity = '1';
        bars[i].style.transition = 'opacity 0.2s';
      } else {
        bars[i].style.opacity = '0.08';
        bars[i].style.transition = 'opacity 0.2s';
      }
    }
  }
}

  }

  const av = avatarFor(s);
  const p = s.progress || {};
  const wa = s.waStats || {};
  const assessments = s.assessments || [];
  const domainStats = reports.domainStats || [];
  const studentDomain = reports.studentDomain || [];

  // Chart data with real dates from plan start_date
  const chartColors = ['#3B82F6','#8B5CF6','#22C55E','#F97316','#EC4899'];
  const chartData = [
    [10,20,20,20,10],[20,25,25,25,20],[35,35,30,35,30],[45,40,45,40,35],[50,50,50,50,45],[55,55,55,60,50]
  ];

  const planStart = s.latestPlan ? new Date(s.latestPlan.start_date) : new Date(s.created_at);
  const weekLabels = chartData.map((_, wi) => {
    const d = new Date(planStart);
    d.setDate(d.getDate() - (chartData.length - 1 - wi) * 7);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  });
  const chartBars = chartData.map((week, wi) => {
    const bars = week.map((val, di) => `<div style="width:16%;height:${val}%;background:${chartColors[di]};border-radius:2px 2px 0 0;" title="${DOMAINS[di].name}: ${val}%"></div>`).join('');
    return `<div class="flex flex-col items-center" style="width:15%;"><div class="flex items-end gap-0.5 w-full justify-center" style="height:180px;">${bars}</div><div class="chart-label">${weekLabels[wi]}</div></div>`;
  }).join('');
  const dateRangeLabel = weekLabels[0] + ' - ' + weekLabels[weekLabels.length - 1];

  const domainCards = assessments.filter(a => a.domain !== 'NIOS').map(a => {
    const d = getDomain(a.domain);
    const skills = (() => { try { return JSON.parse(a.skills_json || '[]'); } catch { return []; } })();
    return `<div class="bg-white rounded-xl border border-gray-200 p-4">
      <div class="flex items-center gap-2 mb-3"><span class="w-3 h-3 rounded-full" style="background:${d.color};"></span><h4 class="font-semibold text-sm">${a.domain}</h4></div>
      <div class="flex items-center gap-2 mb-3">
        <span class="pill ${pillClass(a.baseline)}" style="font-size:11px">${a.baseline || '-'}</span>
        <span class="text-gray-400">&rarr;</span>
        <span class="pill ${pillClass(a.current_level)}" style="font-size:11px">${a.current_level || '-'}</span>
      </div>
      <ul class="text-sm text-gray-600 space-y-1">
        ${skills.map(sk => `<li>&#10003; ${sk}</li>`).join('')}
        ${a.working_on ? `<li class="text-gray-500">&#8226; Working on: ${a.working_on}</li>` : ''}
      </ul>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
        <div><h1 class="text-xl font-bold">Progress Reports</h1><p class="text-sm text-gray-500">${s.name} &middot; ${dateRangeLabel}</p></div>
        <div class="flex items-center gap-3">
          <div class="search-wrap" style="min-width:220px;">
            <input type="text" placeholder="Search student..." value="${s.name}" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-2 focus:ring-sahyog-gold/30" onfocus="openStudentSearch(this,'reports')" oninput="filterStudentSearch(this,'reports')">
            <div id="search-results-reports" class="search-results"></div>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6 flex items-center gap-4">
        <div class="w-10 h-10 rounded-full ${av.bg} flex items-center justify-center ${av.text} font-bold">${av.initial}</div>
        <div class="flex-1"><h3 class="font-semibold text-sm">${s.name}</h3><p class="text-xs text-gray-500">Age ${s.age||'?'} &middot; ${s.diagnosis||''}</p></div>
        <span class="pill ${pillClass(s.niepid_level)}">${s.niepid_level||'N/A'}</span>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
          <div class="text-2xl font-bold text-sahyog-gold">${p.tasksCompleted || '0/0'}</div>
          <div class="text-sm text-gray-500">Tasks Completed</div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
          <div class="text-2xl font-bold text-wa-teal">${p.currentStreak || '-'}</div>
          <div class="text-sm text-gray-500">Current Streak</div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
          <div class="text-2xl font-bold text-purple-600">${p.weeksActive || 0}</div>
          <div class="text-sm text-gray-500">Weeks Active</div>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
          <div class="text-2xl font-bold text-green-600">&#9650;</div>
          <div class="text-sm text-gray-500">${p.trend || 'N/A'}</div>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-5 mb-6">
        <h3 class="font-semibold mb-1">NIEPID Assessment Progress</h3>
        <p class="text-sm text-gray-400 mb-4">Weekly levels across 5 domains &middot; ${dateRangeLabel}</p>
        <div class="flex gap-4">
          <div class="flex flex-col justify-between text-xs text-gray-400 py-1" style="min-width:90px; height:180px;">
            <span>Independent</span><span>PI-Often</span><span>PI-Sometimes</span><span>PI-Rarely</span><span>Dependent</span>
          </div>
          <div class="flex-1" style="height:180px; position:relative;">
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;">
              <div style="border-bottom:1px dashed #e5e7eb;"></div><div style="border-bottom:1px dashed #e5e7eb;"></div><div style="border-bottom:1px dashed #e5e7eb;"></div><div style="border-bottom:1px dashed #e5e7eb;"></div><div style="border-bottom:1px solid #d1d5db;"></div>
            </div>
            <div id="chart-bars" style="position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-around;padding:0 10px;">${chartBars}</div>
          </div>
        </div>
        <div class="flex flex-wrap gap-3 mt-4 pt-3 border-t border-gray-100 text-sm">
          <div class="domain-filter selected flex items-center gap-1.5" onclick="toggleDomainFilter(-1, ${s.id})" data-domain-idx="-1" style="color:#555;"><span class="w-3 h-3 rounded" style="background:#888;"></span> All</div>
          ${DOMAINS.slice(0,5).map((d, i) => `<div class="domain-filter selected flex items-center gap-1.5" onclick="toggleDomainFilter(${i}, ${s.id})" data-domain-idx="${i}" style="color:${d.color};"><span class="w-3 h-3 rounded" style="background:${d.color};"></span> ${d.name}</div>`).join('')}
        </div>
      </div>
      <h3 class="font-semibold mb-3">Domain Breakdown</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">${domainCards}</div>
      <div class="bg-white rounded-xl border border-gray-200 p-5">
        <h3 class="font-semibold mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-wa-teal" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 00.611.611l4.458-1.495A11.952 11.952 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>
          WhatsApp Engagement
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="text-center p-3 bg-green-50 rounded-xl"><div class="text-xl font-bold text-green-700">${wa.msgsSent || 0}</div><div class="text-xs text-gray-500">Messages Sent</div></div>
          <div class="text-center p-3 bg-blue-50 rounded-xl"><div class="text-xl font-bold text-blue-700">${wa.msgsReceived || 0}</div><div class="text-xs text-gray-500">Messages Received</div></div>
          <div class="text-center p-3 bg-amber-50 rounded-xl"><div class="text-xl font-bold text-amber-700">${wa.responseRate || 0}%</div><div class="text-xs text-gray-500">Response Rate</div></div>
          <div class="text-center p-3 bg-purple-50 rounded-xl"><div class="text-xl font-bold text-purple-700">${wa.avgResponseTime || '-'}</div><div class="text-xs text-gray-500">Avg Response Time</div></div>
        </div>
      </div>

      <!-- Engagement by Domain (All Students) -->
      <div class="bg-white rounded-xl border border-gray-200 p-5 mt-6">
        <h3 class="font-semibold mb-1">Engagement by Domain</h3>
        <p class="text-sm text-gray-400 mb-4">Task completion across all students by NIEPID domain</p>
        ${domainStats.length === 0
          ? '<p class="text-center text-gray-400 py-6">No task data available yet.</p>'
          : `<div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50">
              <tr>
                <th class="text-left px-4 py-3 font-semibold text-gray-600">Domain</th>
                <th class="text-center px-4 py-3 font-semibold text-gray-600">Students</th>
                <th class="text-center px-4 py-3 font-semibold text-gray-600">Tasks</th>
                <th class="text-center px-4 py-3 font-semibold text-gray-600">Sent</th>
                <th class="text-center px-4 py-3 font-semibold text-gray-600">Completed</th>
                <th class="text-left px-4 py-3 font-semibold text-gray-600" style="min-width:160px">Completion Rate</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${domainStats.map(ds => {
                const d = getDomain(ds.domain);
                const rate = ds.total_tasks > 0 ? Math.round((ds.completed / ds.total_tasks) * 100) : 0;
                const barColor = rate >= 60 ? '#22C55E' : rate >= 30 ? '#F59E0B' : '#EF4444';
                return `<tr>
                  <td class="px-4 py-3 font-medium"><span class="inline-block w-2.5 h-2.5 rounded-full ${d.dotClass} mr-2"></span>${ds.domain}</td>
                  <td class="px-4 py-3 text-center text-gray-500">${ds.students}</td>
                  <td class="px-4 py-3 text-center text-gray-500">${ds.total_tasks}</td>
                  <td class="px-4 py-3 text-center">${ds.sent}</td>
                  <td class="px-4 py-3 text-center font-medium">${ds.completed}</td>
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-2">
                      <div class="flex-1 bg-gray-100 rounded-full h-2"><div class="h-2 rounded-full" style="width:${rate}%;background:${barColor};"></div></div>
                      <span class="text-xs font-medium w-8 text-right">${rate}%</span>
                    </div>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`}
      </div>

      <!-- Per-Student Domain Heatmap -->
      ${studentDomain.length > 0 ? `
      <div class="bg-white rounded-xl border border-gray-200 p-5 mt-6">
        <h3 class="font-semibold mb-1">Student x Domain Breakdown</h3>
        <p class="text-sm text-gray-400 mb-4">Individual completion by domain across all students</p>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50">
              <tr>
                <th class="text-left px-4 py-3 font-semibold text-gray-600">Student</th>
                ${[...new Set(studentDomain.map(sd => sd.domain))].map(domain => {
                  const d = getDomain(domain);
                  return `<th class="text-center px-3 py-3 font-semibold text-gray-600"><span class="inline-block w-2 h-2 rounded-full ${d.dotClass} mr-1"></span>${domain}</th>`;
                }).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
              ${(() => {
                const byStudent = {};
                studentDomain.forEach(sd => {
                  if (!byStudent[sd.student_id]) byStudent[sd.student_id] = { name: sd.student_name, domains: {} };
                  byStudent[sd.student_id].domains[sd.domain] = { total: sd.total, completed: sd.completed };
                });
                const allDomains = [...new Set(studentDomain.map(sd => sd.domain))];
                return Object.entries(byStudent).map(([sid, st]) => {
                  return `<tr class="cursor-pointer hover:bg-gray-50" onclick="navigate('#/reports/${sid}')">
                    <td class="px-4 py-3 font-medium">${st.name}</td>
                    ${allDomains.map(dom => {
                      const cell = st.domains[dom];
                      if (!cell) return '<td class="px-3 py-3 text-center text-gray-300">-</td>';
                      const rate = cell.total > 0 ? Math.round((cell.completed / cell.total) * 100) : 0;
                      const bg = rate >= 60 ? 'bg-green-100 text-green-700' : rate >= 30 ? 'bg-amber-100 text-amber-700' : rate > 0 ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-500';
                      return `<td class="px-3 py-3 text-center"><span class="inline-block px-2 py-0.5 rounded text-xs font-medium ${bg}">${cell.completed}/${cell.total}</span></td>`;
                    }).join('')}
                  </tr>`;
                }).join('');
              })()}
            </tbody>
          </table>
        </div>
      </div>` : ''}
    </div>`;
}
</script>
</body>
</html>
